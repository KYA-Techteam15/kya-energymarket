name: qualité et image

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main, 'feat-*']
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sens-des-branches:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-branch.mjs
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Base des tests de parcours (comptes) : un Postgres jetable, jamais une base réelle.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kya
          POSTGRES_PASSWORD: kya
          POSTGRES_DB: kya_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kya" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://kya:kya@localhost:5432/kya_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kya-em/web exec playwright install --with-deps chromium
      - run: pnpm verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-playwright
          path: apps/web/test-results
          retention-days: 7

  # Image publiée seulement après une porte de qualité verte, sur une poussée (pas sur une PR).
  # Coolify déploie cette image telle quelle : la production reçoit exactement ce qui a été testé.
  image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kya-techteam15/kya-energymarket
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
